<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110c">
<meta name="robots" content="noindex,nofollow">
<title>Gold H1 Setupy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#14110c;--card:#1f1a12;--line:#33291a;--tx:#f1e9d8;--mu:#9a8d73;--au:#d9aa3c;--lg:#3fb8a5;--sh:#e8685a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 40px;max-width:560px;margin:auto;font-variant-numeric:tabular-nums}
h1{font:600 15px system-ui;color:var(--mu);margin:0 0 2px}
.px{font:700 44px/1.1 Georgia,serif;color:var(--au);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;color:var(--mu);font-size:13px}
.row b{color:var(--tx);font-weight:600}
.warn{background:#3a2a10;border:1px solid var(--au);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
canvas{width:100%;height:190px;background:var(--card);border-radius:10px;display:block}
.t{background:var(--card);border-radius:12px;padding:12px 14px;margin:12px 0;border-left:5px solid var(--mu)}
.t.LONG{border-color:var(--lg)}.t.SHORT{border-color:var(--sh)}
.t h2{margin:0 0 4px;font-size:18px;display:flex;justify-content:space-between}
.LONG h2 span:first-child{color:var(--lg)}.SHORT h2 span:first-child{color:var(--sh)}
.t small{color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.g div{font-size:12px;color:var(--mu)}.g b{display:block;font-size:16px;color:var(--tx)}
.on{color:var(--au);font-weight:700}
h3{margin:22px 0 6px;font-size:16px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st div{background:var(--card);border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mu)}
.st b{display:block;font-size:20px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mu);font-weight:500}
.win{color:var(--lg)}.loss{color:var(--sh)}
button,input{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px 12px}
button{background:var(--au);color:#14110c;border:0;font-weight:700}
input{width:100%;margin:6px 0}
select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px;width:100%;margin:6px 0}
.pos{color:var(--lg)}.neg{color:var(--sh)}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tabs button{flex:1;background:var(--card);color:var(--mu)}.tabs button.on{background:var(--au);color:#14110c}
.f{color:var(--mu);font-size:12px;margin-top:20px}
</style></head><body>
<div class="tabs"><button id="t1" class="on">Setupy</button><button id="t2">Statistiky</button></div>
<div id="p1">
<h1>XAU/USD · H1</h1>
<p class="px" id="px">—</p>
<div class="row" id="meta"></div>
<div id="msg"></div>
<canvas id="cv"></canvas>
<div id="tk"></div>
<h3>Statistiky (tvoří se samy)</h3>
<div class="st" id="st"></div>
<h3>Poslední setupy</h3>
<table id="lg"></table>
<h3>Backtest na historii</h3>
<button id="btb">Spustit backtest (cca 8 měsíců)</button>
<div id="bt" class="f"></div>
<h3>Nastavení</h3>
<label class="f">Minimální síla zóny pro nové setupy</label>
<select id="min"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
<label class="f">Poměr TP k riziku (RR)</label>
<select id="rr"><option value="1.5">1:1.5</option><option value="2">1:2</option><option value="2.5">1:2.5</option><option value="3">1:3</option></select>
<label class="f">Délka backtestu</label>
<select id="per"><option value="0">cca 8 měsíců</option><option value="1">cca 2 roky</option><option value="2">cca 4 roky</option></select>
<label class="f">SL za úrovní (násobek ATR)</label>
<select id="slm"><option value="0.6">0.6</option><option value="1">1.0</option><option value="1.5">1.5</option></select>
<label class="f">Spread brokera (body zlata, např. 0.3)</label>
<input id="spr" type="number" step="0.1" min="0" style="margin:6px 0">
<label class="f">Vynechat asijskou seanci (0:00–7:00 UTC)</label>
<select id="asia"><option value="1">Ano</option><option value="0">Ne</option></select>
<input id="key" type="password" placeholder="Twelve Data API klíč" autocomplete="off">
<button id="go">Uložit a obnovit</button>
<p class="f">Data se obnovují každých 5 minut, dokud je aplikace otevřená. Výsledky ukazují kvalitu pravidel, ne záruku zisku. Nejde o finanční poradenství.</p>
</div>
<div id="p2" style="display:none">
<h3>Srovnání SL × RR (se spreadem)</h3>
<select id="gt"><option value="1">Jen setupy po trendu</option><option value="0">Všechny setupy</option></select>
<button id="grb">Spustit srovnání</button>
<div id="gr" class="f"></div>
<h3>Pokročilé statistiky</h3>
<select id="src"><option value="bt">Backtest</option><option value="live">Moje (živé) setupy</option></select>
<canvas id="eq"></canvas>
<div id="adv"></div>
</div>
<script>
const $=i=>document.getElementById(i);
const S={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let key=S.g('key',''),log=S.g('log',[]),minSc=S.g('min',3),asia=S.g('asia',1),RR=S.g('rr',2),per=S.g('per',0),BT=S.g('bt',[]),SLM=S.g('slm',.6),SPR=S.g('spr',.3);$('key').value=key;$('min').value=minSc;$('asia').value=asia;$('rr').value=RR;$('per').value=per;$('slm').value=SLM;$('spr').value=SPR;
const rv=x=>(x.o==='win'?x.rr:-1)-(x.r?SPR/x.r:0);
const f=n=>n.toFixed(1),N=x=>parseFloat(String(x).replace(',','.'));
async function load(n,end){
  const r=await fetch('https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1h&outputsize='+n+'&order=ASC'+(end?'&end_date='+encodeURIComponent(end):'')+'&apikey='+encodeURIComponent(key));
  const j=await r.json();if(j.status==='error'||!j.values)throw new Error(j.message||'Chyba dat');
  return j.values.map(v=>({d:v.datetime,t:Date.parse(v.datetime.replace(' ','T')+'Z'),o:N(v.open),h:N(v.high),l:N(v.low),c:N(v.close)}))}
function ema(a,n){const k=2/(n+1);let e=a[0];return a.map((x,i)=>(e=i?x*k+e*(1-k):x))}
function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l?100-100/(1+g/l):100}
function avgRange(a,n=14){const x=a.slice(-n);return x.reduce((s,q)=>s+q.h-q.l,0)/x.length}
function trend(w){const c=w.slice(-120).map(q=>q.c),a=ema(c,20),b=ema(c,50);return a[a.length-1]>b[b.length-1]?1:-1}

/* Zóny: swing úrovně sloučené do shluků + profil času na ceně (TPO, aproximace POC) */
/* Fibonacci 61.8–78.6 % z dominantních swingů (posledních 250 a 80 svíček) */
function gps(w){const o=[];[250,80].forEach(n=>{const v=w.slice(-n);let H=-1,L=1e9,ih=0,il=0;v.forEach((q,i)=>{if(q.h>H){H=q.h;ih=i}if(q.l<L){L=q.l;il=i}});const d=H-L;if(d<=0)return;
  o.push(il<ih?[H-.786*d,H-.618*d]:[L+.618*d,L+.786*d])});return o}
function analyze(w){
  const A=avgRange(w),p=w[w.length-1].c,pv=[];
  for(let i=4;i<w.length-4;i++){let hi=1,lo=1;for(let j=i-4;j<=i+4;j++){if(w[j].h>w[i].h)hi=0;if(w[j].l<w[i].l)lo=0}if(hi)pv.push(w[i].h);if(lo)pv.push(w[i].l)}
  pv.sort((x,y)=>x-y);const cl=[];
  for(const q of pv){const c=cl[cl.length-1];if(c&&q-c.mx<=.5*A){c.mx=q;c.s+=q;c.n++}else cl.push({mx:q,s:q,n:1})}
  const mn=Math.min(...w.map(q=>q.l)),bw=Math.max(.5,A/6),b=[];
  w.forEach(q=>{for(let k=Math.floor((q.l-mn)/bw);k<=Math.floor((q.h-mn)/bw);k++)b[k]=(b[k]||0)+1});
  let pk=0,pi=0;b.forEach((x,i)=>{if(x>pk){pk=x;pi=i}});
  const gp=gps(w),z=cl.map(c=>{const lv=c.s/c.n,k=Math.floor((lv-mn)/bw),r=Math.round(A/bw);let m=0;for(let q=k-r;q<=k+r;q++)m=Math.max(m,b[q]||0);const ra=m/pk;
    const fib=gp.some(g=>lv>=g[0]-.2*A&&lv<=g[1]+.2*A);return{lv,n:c.n,poc:ra>=.95,fib,sc:c.n+(ra>=.95?2:ra>=.7?1:0)+(fib?2:0)}});
  return{A,p,poc:mn+(pi+.5)*bw,z}}
function build(an,tr,min){const o=[],{A,p,z}=an;
  const up=z.filter(x=>x.lv>p+.7*A&&x.sc>=min).sort((x,y)=>x.lv-y.lv)[0],dn=z.filter(x=>x.lv<p-.7*A&&x.sc>=min).sort((x,y)=>y.lv-x.lv)[0];
  if(up){const e=up.lv-.3*A,sl=up.lv+SLM*A,r=sl-e;o.push({dir:'SHORT',e,sl,tp:e-RR*r,tp2:e-(RR+1)*r,lv:up.lv,sc:up.sc,n:up.n,poc:up.poc,fib:up.fib,tr:tr<0})}
  if(dn){const e=dn.lv+.3*A,sl=dn.lv-SLM*A,r=e-sl;o.push({dir:'LONG',e,sl,tp:e+RR*r,tp2:e+(RR+1)*r,lv:dn.lv,sc:dn.sc,n:dn.n,poc:dn.poc,fib:dn.fib,tr:tr>0})}
  return o}
/* Simulace: vrací win / loss / exp, nebo null když ještě neskončilo. Při SL i TP v jedné svíčce se počítá SL. */
function sim(a,i,s,skip){let st=0,n=0;const L=s.dir==='LONG';
  for(let j=i+1;j<a.length;j++){const c=a[j];n++;
    if(!st){if(c.l<=s.e&&c.h>=s.e){st=1;s.et=c.t;if(skip&&new Date(c.t).getUTCHours()<7)return'skip'}else if(n>24)return'exp';else continue}
    if(L?c.l<=s.sl:c.h>=s.sl)return'loss';if(L?c.h>=s.tp:c.l<=s.tp)return'win';if(n>300)return'exp'}
  return null}

function chart(a,ls){const c=$('cv'),x=c.getContext('2d');c.width=700;c.height=380;
  const v=a.slice(-60),all=v.flatMap(q=>[q.h,q.l]).concat(ls.map(l=>l.y)),mn=Math.min(...all)-4,mx=Math.max(...all)+4,
  Y=p=>380-(p-mn)/(mx-mn)*380,w=700/v.length;
  v.forEach((q,i)=>{const X=i*w+w/2;x.strokeStyle=q.c>=q.o?'#3fb8a5':'#e8685a';x.lineWidth=1.5;x.beginPath();x.moveTo(X,Y(q.h));x.lineTo(X,Y(q.l));x.stroke();x.lineWidth=5;x.beginPath();x.moveTo(X,Y(q.o));x.lineTo(X,Y(q.c));x.stroke()});
  x.lineWidth=1.5;x.font='20px system-ui';
  ls.forEach(l=>{x.strokeStyle=x.fillStyle=l.c;x.setLineDash([8,6]);x.beginPath();x.moveTo(0,Y(l.y));x.lineTo(700,Y(l.y));x.stroke();x.fillText(l.n+' '+f(l.y),6,Y(l.y)-5)})}

function render(raw){
  const a=raw.filter(q=>q.h-q.l>=1),w=a.slice(-250),last=a[a.length-1],p=raw[raw.length-1].c;
  const tr=trend(w),an=analyze(w),A=an.A,R=rsi(w.map(q=>q.c)),tk=build(an,tr,minSc);
  const closed=raw[raw.length-1].h-raw[raw.length-1].l<1;
  $('px').textContent=f(p);
  $('meta').innerHTML=`<span>Trend <b>${tr>0?'rostoucí':'klesající'}</b></span><span>RSI <b>${R.toFixed(0)}</b></span><span>ATR <b>${f(A)}</b></span><span>POC <b>${f(an.poc)}</b></span><span>Aktualizace <b>${new Date().toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'})}</b></span>`;
  $('msg').innerHTML=(closed?'<div class="warn">Trh je zavřený, ceny jsou z posledního close. Nové setupy dávají smysl po otevření.</div>':'')+(asia&&!closed&&new Date().getUTCHours()<7?'<div class="warn">Asijská seance (do 7:00 UTC). Vstupy vynechej a počkej na Londýn.</div>':'');
  tk.forEach(s=>{const id=s.dir+Math.round(s.lv);if(!log.some(x=>x.id===id&&last.t-x.t<864e5))log.push({id,dir:s.dir,e:s.e,sl:s.sl,tp:s.tp,t:last.t,st:'wait',rr:RR,tr:s.tr?1:0,sc:s.sc,poc:s.poc?1:0,fib:s.fib?1:0,r:Math.abs(s.e-s.sl)})});
  log.forEach(it=>{if(it.st!=='wait')return;const i=a.findIndex(q=>q.t===it.t);if(i<0)return;const o=sim(a,i,it,asia);if(o)it.st=o});
  log=log.slice(-300);S.s('log',log);
  $('tk').innerHTML=tk.map(s=>{const act=Math.abs(p-s.e)<=.5*A,rk=Math.abs(s.e-s.sl);
    return `<div class="t ${s.dir}"><h2><span>${s.dir}</span><span class="${act?'on':''}">${act?'v zóně':'čekej na '+f(s.e)}</span></h2>
    <small>${s.tr?'Po trendu':'Proti trendu'} · síla zóny ${s.sc} (${s.n}× dotyk${s.poc?', u POC':''}${s.fib?', fib 61.8–78.6':''}) · úroveň ${f(s.lv)} · riziko ${f(rk)} b.</small>
    <div class="g"><div>Vstup<b>${f(s.e)}</b></div><div>SL<b>${f(s.sl)}</b></div><div>TP 1:${RR}<b>${f(s.tp)}</b></div><div>TP 1:${RR+1}<b>${f(s.tp2)}</b></div></div></div>`}).join('')||'<div class="warn">Žádná dostatečně silná zóna v okolí ceny. Můžeš snížit minimální sílu v nastavení.</div>';
  const pr=tk.find(s=>s.tr)||tk[0],ls=[{y:an.poc,c:'#d9aa3c',n:'POC'}];
  tk.forEach(s=>ls.push({y:s.lv,c:'#9a8d73',n:s.dir==='SHORT'?'odpor':'podpora'}));
  if(pr)ls.push({y:pr.e,c:'#f1e9d8',n:'vstup'},{y:pr.sl,c:'#e8685a',n:'SL'},{y:pr.tp,c:'#3fb8a5',n:'TP'});
  chart(a,ls);stats();renderAdv()}

function stats(){
  const d=log.filter(x=>x.st==='win'||x.st==='loss'),w=d.filter(x=>x.st==='win').length,Rr=+d.reduce((s,x)=>s+(x.st==='win'?(x.rr||2):-1)-(x.r?SPR/x.r:0),0).toFixed(1),op=log.filter(x=>x.st==='wait').length;
  $('st').innerHTML=`<div><b>${d.length}</b>uzavřeno</div><div><b>${d.length?Math.round(100*w/d.length):0} %</b>win rate</div><div><b>${Rr>0?'+':''}${Rr} R</b>celkem</div><div><b>${op}</b>otevřeno</div>`;
  const nm={wait:'čeká',win:'TP',loss:'SL',exp:'propadl',skip:'Asie'};
  $('lg').innerHTML='<tr><th>Čas</th><th>Směr</th><th>Vstup</th><th>Stav</th></tr>'+(log.slice(-8).reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleString('cs',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${x.dir}</td><td>${f(x.e)}</td><td class="${x.st}">${nm[x.st]}</td></tr>`).join('')||'<tr><td colspan="4">Zatím žádné. Setupy se ukládají při každém obnovení.</td></tr>')}

async function bt(){
  if(!key){$('bt').textContent='Nejdřív zadej API klíč.';return}
  try{
    const pages=[1,3,6][per];let M=[],end=null;
    for(let p=0;p<pages;p++){$('bt').textContent='Stahuju historii '+(p+1)+'/'+pages+'…';const pg=await load(5000,end);if(!pg.length)break;
      M=pg.filter(q=>!M.length||q.t<M[0].t).concat(M);end=pg[0].d;if(pg.length<5000)break;await new Promise(r=>setTimeout(r,900))}
    const a=M.filter(q=>q.h-q.l>=1);$('bt').textContent='Počítám…';await new Promise(r=>setTimeout(r,60));
    const R=[],last={};
    for(let i=249;i<a.length-2;i++){const w=a.slice(i-249,i+1),an=analyze(w),tr=trend(w);
      for(const s of build(an,tr,1)){const id=s.dir+Math.round(s.lv);if(id in last&&i-last[id]<24)continue;last[id]=i;const t1={...s},o=sim(a,i,t1);if(o==='win'||o==='loss')R.push({...s,o,et:t1.et})}}
    BT=R.map(x=>({dir:x.dir,tr:x.tr?1:0,sc:x.sc,poc:x.poc?1:0,fib:x.fib?1:0,o:x.o,et:x.et,rr:RR,r:Math.abs(x.e-x.sl)}));S.s('bt',BT);
    const an=x=>new Date(x.et).getUTCHours()>=7;
    const G=[['Všechny',x=>1],['Síla ≥ 3',x=>x.sc>=3],['Síla ≥ 4',x=>x.sc>=4],['Síla ≥ 5',x=>x.sc>=5],['U fib 61.8–78.6',x=>x.fib],['U POC',x=>x.poc],['Po trendu',x=>x.tr],['Proti trendu',x=>!x.tr],['Bez Asie',an],['Jen Asie',x=>!an(x)],['Bez Asie + trend + síla ≥ 4',x=>x.tr&&x.sc>=4&&an(x)],['LONG',x=>x.dir==='LONG'],['SHORT',x=>x.dir==='SHORT']];
    const rows=G.map(([nm,fn])=>{const g=R.filter(fn),n=g.length,w=g.filter(x=>x.o==='win').length,t=g.reduce((s,x)=>s+(x.o==='win'?RR:-1)-SPR/Math.abs(x.e-x.sl),0);
      return `<tr><td>${nm}</td><td>${n}</td><td>${n?Math.round(100*w/n):0} %</td><td class="${t>=0?'pos':'neg'}">${t>0?'+':''}${t.toFixed(0)}</td><td class="${t>=0?'pos':'neg'}">${n?(t/n).toFixed(2):'—'}</td></tr>`}).join('');
    const d=t=>new Date(t).toLocaleDateString('cs');
    $('bt').innerHTML=`<table><tr><th>Skupina</th><th>Obch.</th><th>Win</th><th>R</th><th>R/obch.</th></tr>${rows}</table><p>Období ${d(a[0].t)} až ${d(a[a.length-1].t)}, ${a.length} H1 svíček. Při RR 1:${RR} je zisková hranice win rate ${Math.round(100/(1+RR))} %. Spread ${SPR} b. je započítán, poplatky ne. Podrobnosti najdeš v záložce Statistiky.</p>`;
    renderAdv()
  }catch(e){$('bt').textContent='Chyba: '+e.message}}

/* Pokročilé statistiky */
function kpi(L){const R=L.map(rv),pts=[0];let eq=0,pk=0,dd=0,ls=0,ml=0,ws=0,mw=0;
  R.forEach(r=>{eq+=r;pts.push(eq);pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq);if(r<0){ls++;ml=Math.max(ml,ls);ws=0}else{ws++;mw=Math.max(mw,ws);ls=0}});
  const gw=R.filter(r=>r>0).reduce((a,b)=>a+b,0),gl=-R.filter(r=>r<0).reduce((a,b)=>a+b,0);
  return{n:L.length,w:Math.round(100*R.filter(r=>r>0).length/L.length),tot:eq,exp:eq/L.length,pf:gl?gw/gl:99,dd,ml,mw,pts}}
function renderAdv(){
  const src=$('src').value,L=(src==='bt'?BT:log.filter(x=>x.st==='win'||x.st==='loss').map(x=>({dir:x.dir,tr:x.tr,sc:x.sc,poc:x.poc,fib:x.fib,o:x.st,et:x.t,rr:x.rr||2,r:x.r}))).slice().sort((a,b)=>a.et-b.et);
  const c=$('eq'),x=c.getContext('2d');c.width=700;c.height=300;
  if(!L.length){$('adv').innerHTML='<div class="warn">Zatím žádná data. Spusť backtest, nebo nech aplikaci sbírat setupy.</div>';return}
  const k=kpi(L),mn=Math.min(...k.pts,0),mx=Math.max(...k.pts,0)+1,Y=v=>290-(v-mn)/(mx-mn)*280;
  x.strokeStyle='#33291a';x.beginPath();x.moveTo(0,Y(0));x.lineTo(700,Y(0));x.stroke();
  x.strokeStyle='#d9aa3c';x.lineWidth=3;x.beginPath();k.pts.forEach((v,i)=>{const X=i/(k.pts.length-1||1)*700;i?x.lineTo(X,Y(v)):x.moveTo(X,Y(v))});x.stroke();
  x.fillStyle='#9a8d73';x.font='20px system-ui';x.fillText('Kumulativní výsledek v R: '+k.tot.toFixed(1),8,24);
  const h=Math.floor(L.length/2),a=kpi(L.slice(0,h||1)),b=kpi(L.slice(h)),ex=v=>`<span class="${v>=0?'pos':'neg'}">${v.toFixed(2)}</span>`;
  const brk=(t,fn)=>{const m={};L.forEach(q=>{const g=fn(q);(m[g]=m[g]||[]).push(q)});return `<h3>${t}</h3><table><tr><th></th><th>N</th><th>Win</th><th>R/ob.</th></tr>`+Object.keys(m).sort().map(g=>{const q=m[g],w=q.filter(z=>z.o==='win').length,tt=q.reduce((s,z)=>s+rv(z),0);return `<tr><td>${g.slice(2)}</td><td>${q.length}</td><td>${Math.round(100*w/q.length)} %</td><td class="${tt>=0?'pos':'neg'}">${(tt/q.length).toFixed(2)}</td></tr>`}).join('')+'</table>'};
  const hr=q=>new Date(q.et).getUTCHours(),dn=['a Ne','b Po','c Út','d St','e Čt','f Pá','g So'];
  $('adv').innerHTML=`<div class="st"><div><b>${k.n}</b>obchodů</div><div><b>${k.w} %</b>win rate</div><div><b>${k.exp.toFixed(2)}</b>R/obchod</div><div><b>${k.pf.toFixed(2)}</b>profit factor</div></div>
  <div class="st" style="margin-top:8px"><div><b>${k.tot.toFixed(0)} R</b>celkem</div><div><b>${k.dd.toFixed(0)} R</b>max. propad</div><div><b>${k.ml}</b>série ztrát</div><div><b>${k.mw}</b>série výher</div></div>
  <p class="f">1. polovina historie: ${ex(a.exp)} R/obch. · 2. polovina: ${ex(b.exp)} R/obch. Pokud se výrazně liší, výsledek není stabilní.</p>`+
  brk('Podle seance (UTC)',q=>hr(q)<7?'a Asie 0–7':hr(q)<13?'b Londýn 7–13':hr(q)<21?'c New York 13–21':'d Večer 21–24')+
  brk('Podle dne v týdnu',q=>dn[new Date(q.et).getUTCDay()])+brk('Podle směru',q=>q.dir==='LONG'?'a LONG':'b SHORT')+
  brk('Podle síly zóny',q=>'x '+(q.sc||'?'))+brk('Fibonacci 61.8–78.6',q=>q.fib?'a U fib':'b Mimo fib')+brk('Trend',q=>q.tr?'a Po trendu':'b Proti trendu')}

let HC=null;
async function hist(){if(HC&&HC.per===per)return HC.a;
  const pages=[1,3,6][per];let M=[],end=null;
  for(let p=0;p<pages;p++){$('gr').textContent='Stahuju historii '+(p+1)+'/'+pages+'…';const pg=await load(5000,end);if(!pg.length)break;
    M=pg.filter(q=>!M.length||q.t<M[0].t).concat(M);end=pg[0].d;if(pg.length<5000)break;await new Promise(r=>setTimeout(r,900))}
  HC={per,a:M.filter(q=>q.h-q.l>=1)};return HC.a}
/* Pro každý setup se zkusí všech 9 kombinací SL (0.6/1.0/1.5 ATR) a RR (1.5/2/3). Spread se odečítá v R. První polovina historie = ladění, druhá = ověření. */
function gridCalc(a,only){
  const C=[];[.6,1,1.5].forEach(m=>[1.5,2,3].forEach(r=>C.push({m,r,A:[],B:[]})));
  const mid=Math.floor(a.length/2),last={};
  for(let i=249;i<a.length-2;i++){const w=a.slice(i-249,i+1),an=analyze(w),tr=trend(w);
    for(const s of build(an,tr,minSc)){if(only&&!s.tr)continue;const id=s.dir+Math.round(s.lv);if(id in last&&i-last[id]<24)continue;last[id]=i;
      const Sh=s.dir==='SHORT';
      for(const c of C){const sl=Sh?s.lv+c.m*an.A:s.lv-c.m*an.A,rk=Math.abs(s.e-sl),o=sim(a,i,{dir:s.dir,e:s.e,sl,tp:Sh?s.e-c.r*rk:s.e+c.r*rk});
        if(o==='win'||o==='loss')(i<mid?c.A:c.B).push((o==='win'?c.r:-1)-SPR/rk)}}}
  return C}
async function grid(){
  if(!key){$('gr').textContent='Nejdřív zadej API klíč.';return}
  try{const a=await hist();$('gr').textContent='Počítám…';await new Promise(r=>setTimeout(r,60));
    const only=$('gt').value==='1',C=gridCalc(a,only);
    const ex=r=>r.length?r.reduce((x,y)=>x+y,0)/r.length:null,fm=v=>v===null?'<td>—</td>':`<td class="${v>=0?'pos':'neg'}">${v.toFixed(2)}</td>`;
    let best=null;C.forEach(c=>{c.e1=ex(c.A);c.e2=ex(c.B);if(c.A.length>=30&&(!best||c.e1>best.e1))best=c});
    const rows=C.map(c=>`<tr><td>${c===best?'★ ':''}SL ${c.m} · 1:${c.r}</td><td>${c.A.length+c.B.length}</td>${fm(c.e1)}${fm(c.e2)}${fm(ex(c.A.concat(c.B)))}</tr>`).join('');
    $('gr').innerHTML=`<table><tr><th>Varianta</th><th>Obch.</th><th>1. pol.</th><th>2. pol.</th><th>Celkem</th></tr>${rows}</table><p>Hodnoty jsou R na obchod po spreadu ${SPR} b. Setupy od síly ${minSc}${only?', jen po trendu':''}. ★ = nejlepší v 1. polovině (min. 30 obchodů).${best&&best.e2!==null?` Na nových datech (2. polovina) dává ${best.e2.toFixed(2)} R/obchod.`:''} Rozhoduje 2. polovina, ne nejvyšší číslo celkem.</p>`
  }catch(e){$('gr').textContent='Chyba: '+e.message}}

async function run(){
  if(!key){$('msg').innerHTML='<div class="warn">Zadej dole svůj Twelve Data API klíč.</div>';stats();return}
  try{render(await load(400))}catch(e){$('msg').innerHTML='<div class="warn">Chyba ('+(e.name||'?')+'): '+(e.message||'bez textu')+'</div>'}}
$('go').onclick=()=>{key=$('key').value.trim();minSc=+$('min').value;asia=+$('asia').value;RR=+$('rr').value;per=+$('per').value;SLM=+$('slm').value;SPR=+$('spr').value||0;S.s('key',key);S.s('min',minSc);S.s('asia',asia);S.s('rr',RR);S.s('per',per);S.s('slm',SLM);S.s('spr',SPR);run()};
$('btb').onclick=bt;$('grb').onclick=grid;
const tab=n=>{$('p1').style.display=n==1?'':'none';$('p2').style.display=n==2?'':'none';$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';if(n==2)renderAdv()};
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('src').onchange=renderAdv;
run();setInterval(run,3e5);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
