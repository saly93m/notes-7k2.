<h1>XAU/USD · H1</h1>

<p class="f">Signály se obnovují každých 5 minut, dokud je aplikace otevřená. Výsledky backtestu ukazují kvalitu pravidel, ne záruku zisku. Nejde o finanční poradenství.</p>
<script>
const $=i=>document.getElementById(i);
const S={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let key=S.g('key',''),RR=S.g('rr',1.5),SPR=S.g('spr',.3),minSc=S.g('min',4),SLM=S.g('slm',.6),per=S.g('per',1),VM=S.g('vm',1);
const N=x=>parseFloat(String(x).replace(',','.')),f=n=>n.toFixed(1),mean=r=>r.length?r.reduce((x,y)=>x+y,0)/r.length:null;
$('key').value=key;$('rr').value=RR;$('spr').value=SPR;$('vm').value=VM;$('slm').value=SLM;$('per').value=per;
async function load(n,end,iv){
  const r=await fetch('https://api.twelvedata.com/time_series?symbol=XAU/USD&interval='+(iv||'1h')+'&outputsize='+n+'&order=ASC'+(end?'&end_date='+encodeURIComponent(end):'')+'&apikey='+encodeURIComponent(key));
  const j=await r.json();if(j.status==='error'||!j.values)throw new Error(j.message||'Chyba dat');
  return j.values.map(v=>({d:v.datetime,t:Date.parse(v.datetime.replace(' ','T')+'Z'),o:N(v.open),h:N(v.high),l:N(v.low),c:N(v.close)}))}
function ema(a,n){const k=2/(n+1);let e=a[0];return a.map((x,i)=>(e=i?x*k+e*(1-k):x))}
function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l?100-100/(1+g/l):100}
function avgRange(a,n=14){const x=a.slice(-n);return x.reduce((s,q)=>s+q.h-q.l,0)/x.length}
function trend(w){const c=w.slice(-120).map(q=>q.c),a=ema(c,20),b=ema(c,50);return a[a.length-1]>b[b.length-1]?1:-1}

/* Zóny: swing úrovně sloučené do shluků + profil času na ceně (TPO, aproximace POC) */
/* Fibonacci 61.8–78.6 % z dominantních swingů (posledních 250 a 80 svíček) */
function gps(w){const o=[];[250,80].forEach(n=>{const v=w.slice(-n);let H=-1,L=1e9,ih=0,il=0;v.forEach((q,i)=>{if(q.h>H){H=q.h;ih=i}if(q.l<L){L=q.l;il=i}});const d=H-L;if(d<=0)return;
  o.push(il<ih?[H-.786*d,H-.618*d]:[L+.618*d,L+.786*d])});return o}
function analyze(w){
  const A=avgRange(w),p=w[w.length-1].c,pv=[];
  for(let i=4;i<w.length-4;i++){let hi=1,lo=1;for(let j=i-4;j<=i+4;j++){if(w[j].h>w[i].h)hi=0;if(w[j].l<w[i].l)lo=0}if(hi)pv.push(w[i].h);if(lo)pv.push(w[i].l)}
  pv.sort((x,y)=>x-y);const cl=[];
  for(const q of pv){const c=cl[cl.length-1];if(c&&q-c.mx<=.5*A){c.mx=q;c.s+=q;c.n++}else cl.push({mx:q,s:q,n:1})}
  const mn=Math.min(...w.map(q=>q.l)),bw=Math.max(.5,A/6),b=[];
  w.forEach(q=>{for(let k=Math.floor((q.l-mn)/bw);k<=Math.floor((q.h-mn)/bw);k++)b[k]=(b[k]||0)+1});
  let pk=0,pi=0;b.forEach((x,i)=>{if(x>pk){pk=x;pi=i}});
  const gp=gps(w),z=cl.map(c=>{const lv=c.s/c.n,k=Math.floor((lv-mn)/bw),r=Math.round(A/bw);let m=0;for(let q=k-r;q<=k+r;q++)m=Math.max(m,b[q]||0);const ra=m/pk;
    const fib=gp.some(g=>lv>=g[0]-.2*A&&lv<=g[1]+.2*A);return{lv,n:c.n,poc:ra>=.95,fib,sc:c.n+(ra>=.95?2:ra>=.7?1:0)+(fib?2:0)}});
  return{A,p,poc:mn+(pi+.5)*bw,z}}
function build(an,tr,min){const o=[],{A,p,z}=an;
  const up=z.filter(x=>x.lv>p+.7*A&&x.sc>=min).sort((x,y)=>x.lv-y.lv)[0],dn=z.filter(x=>x.lv<p-.7*A&&x.sc>=min).sort((x,y)=>y.lv-x.lv)[0];
  if(up){const e=up.lv-.3*A,sl=up.lv+SLM*A,r=sl-e;o.push({dir:'SHORT',e,sl,tp:e-RR*r,tp2:e-(RR+1)*r,lv:up.lv,sc:up.sc,n:up.n,poc:up.poc,fib:up.fib,tr:tr<0})}
  if(dn){const e=dn.lv+.3*A,sl=dn.lv-SLM*A,r=e-sl;o.push({dir:'LONG',e,sl,tp:e+RR*r,tp2:e+(RR+1)*r,lv:dn.lv,sc:dn.sc,n:dn.n,poc:dn.poc,fib:dn.fib,tr:tr>0})}
  return o}
/* Simulace: vrací win / loss / exp, nebo null když ještě neskončilo. Při SL i TP v jedné svíčce se počítá SL. */
function sim(a,i,s,skip){let st=0,n=0;const L=s.dir==='LONG';
  for(let j=i+1;j<a.length;j++){const c=a[j];n++;
    if(!st){if(c.l<=s.e&&c.h>=s.e){st=1;s.et=c.t;if(skip&&new Date(c.t).getUTCHours()<7)return'skip'}else if(n>24)return'exp';else continue}
    if(L?c.l<=s.sl:c.h>=s.sl)return'loss';if(L?c.h>=s.tp:c.l<=s.tp)return'win';if(n>300)return'exp'}
  return null}

function trend4(a){const b=[];let k=-1;for(const q of a.slice(-500)){const h=Math.floor(q.t/144e5);if(h!==k){b.push(q.c);k=h}else b[b.length-1]=q.c}
  const e1=ema(b,20),e2=ema(b,50);return e1[e1.length-1]>e2[e2.length-1]?1:-1}
/* Setupy pro svíčku i: zóny, trend H1 a H4, volatilita (ATR14 / ATR100) */
async function pgs(n,iv,el){let M=[],end=null;
  for(let p=0;p<n;p++){el.textContent='Stahuju historii '+(p+1)+'/'+n+'…';const pg=await load(5000,end,iv);if(!pg.length)break;
    M=pg.filter(q=>!M.length||q.t<M[0].t).concat(M);end=pg[0].d;if(pg.length<5000)break;await new Promise(r=>setTimeout(r,1500))}
  return M}
const MG=[['fix','Pevný SL/TP'],['be','Breakeven po 1R'],['part','50 % na 1R + BE'],['trail','Trailing po 1R']];
/* Správa obchodu na H1. Stop se kontroluje dřív než cíl a posun SL platí až od další svíčky (pesimisticky). Vrací výsledek v R po spreadu. */
function mgmt(a,i,L,e,sl,mode){const r=Math.abs(e-sl),d=L?1:-1,tp=L?e+RR*r:e-RR*r;let s=sl,re=0,sz=1,on=0;
  for(let j=i+1;j<a.length&&j<i+400;j++){const c=a[j];
    if(L?c.l<=s:c.h>=s)return{R:re+sz*(s-e)/r*d-SPR/r,t:c.t};
    if(mode!=='fix'&&(on||(L?c.h>=e+r:c.l<=e-r))){if(!on){on=1;s=e;if(mode==='part'){re+=.5;sz=.5}}if(mode==='trail')s=L?Math.max(s,c.h-r):Math.min(s,c.l+r)}
    if(mode!=='trail'&&(L?c.h>=tp:c.l<=tp))return{R:re+sz*RR-SPR/r,t:c.t}}
  const c=a[Math.min(a.length-1,i+399)];return{R:re+sz*(c.c-e)/r*d-SPR/r,t:c.t}}
const dayOf=q=>Math.floor(q.t/864e5),hourOf=q=>new Date(q.t).getUTCHours();
function genAsia(a,mid,h4,k0){const out=[];let i=0;
  while(i<a.length){const d=dayOf(a[i]);let j=i,hi=-1,lo=1e9,n=0;
    while(j<a.length&&dayOf(a[j])===d&&hourOf(a[j])<7){hi=Math.max(hi,a[j].h);lo=Math.min(lo,a[j].l);n++;j++}
    let q=j;
    if(n>=5&&q>=250){const A=avgRange(a.slice(q-14,q));
      for(;q<a.length&&dayOf(a[q])===d&&hourOf(a[q])<13;q++){const c=a[q],up=c.c>hi+.1*A,dn=c.c<lo-.1*A;if(!up&&!dn)continue;
        const L=up,e=c.c,sl=mid?(hi+lo)/2:(L?lo:hi),rk=Math.abs(e-sl);
        if(q>=k0&&rk>=.3*A&&rk<=3*A&&(!h4||(trend4(a.slice(Math.max(0,q-499),q+1))>0)===L))out.push({i:q,L,e,sl,et:c.t+36e5,ty:'Asia průraz',hi,lo});
        break}}
    i=j;while(i<a.length&&dayOf(a[i])===d)i++}
  return out}
function genPull(a,k0){const out=[],c=a.map(q=>q.c),E20=ema(c,20),E50=ema(c,50);let lL=-99,lS=-99;
  for(let i=Math.max(300,k0);i<a.length-1||(k0>0&&i<a.length);i++){const q=a[i],A=avgRange(a.slice(i-14,i));
    const up=E20[i]>E50[i]&&E20[i]-E20[i-24]>A,dn=E20[i]<E50[i]&&E20[i-24]-E20[i]>A;let L;
    if(up&&q.l<=E50[i]&&q.c>E50[i]&&q.c>q.o&&i-lL>12)L=true;else if(dn&&q.h>=E50[i]&&q.c<E50[i]&&q.c<q.o&&i-lS>12)L=false;else continue;
    if((trend4(a.slice(Math.max(0,i-499),i+1))>0)!==L)continue;
    const w=a.slice(i-5,i+1),e=q.c,sl=L?Math.min(...w.map(x=>x.l))-.1*A:Math.max(...w.map(x=>x.h))+.1*A,rk=Math.abs(e-sl);
    if(rk<.3*A||rk>2.5*A)continue;if(L)lL=i;else lS=i;out.push({i,L,e,sl,et:q.t+36e5,ty:'Pullback EMA50'})}
  return out}

/* ===== CVD indikátor =====
   Zlato ve zdroji dat nemá objem. Objem se proto odhaduje rozsahem svíčky (nebo je konstantní). Hodnoty se tak mohou lišit od TradingView.
   Denní reset CVD je v 17:00 New York (začátek forexového dne). Pro sell se Flow Score počítá zrcadlově (moje rozšíření, v originále je jen pro buy). */
const NYF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});
function sessDay(t){const p={};NYF.formatToParts(new Date(t)).forEach(x=>p[x.type]=x.value);return Math.floor((Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)+7*36e5)/864e5)}
function smaA(x,n){const o=[];let s=0;for(let i=0;i<x.length;i++){s+=x[i];if(i>=n)s-=x[i-n];o.push(i>=n-1?s/n:null)}return o}
function cvdCalc(a){const n=a.length,cl=(v,l,h)=>Math.max(l,Math.min(h,v));
  const tr=a.map((q,i)=>i?Math.max(q.h-q.l,Math.abs(q.h-a[i-1].c),Math.abs(q.l-a[i-1].c)):q.h-q.l),atr=[];tr.forEach((v,i)=>atr.push(i?(atr[i-1]*13+v)/14:v));
  const atrAvg=smaA(atr,50),vol=a.map(q=>VM?Math.max(q.h-q.l,.01):1),avgV=smaA(vol,20),conf=[],rv=[],del=[];
  for(let i=0;i<n;i++){const q=a[i],rg=Math.max(q.h-q.l,.01),br=Math.abs(q.c-q.o)/rg,cp=(q.c-q.l)/rg,uw=(q.h-Math.max(q.o,q.c))/rg,lw=(Math.min(q.o,q.c)-q.l)/rg,wp=Math.max(.1,1-(uw+lw)*.5),
      vf=atrAvg[i]?cl(atr[i]/atrAvg[i],.5,2):1,rel=avgV[i]?cl(vol[i]/avgV[i],0,2):1,cs=q.c>q.o?cp:1-cp,as=cl(1/vf,0,1);
    const c=cl((br*.25+cs*.25+wp*.20+as*.15+rel/2*.10+br*.05)/Math.sqrt(vf),0,1);conf.push(c);rv.push(rel);
    del.push(q.c>q.o?vol[i]*c*cp:q.c<q.o?-vol[i]*c*(1-cp):0)}
  const sm=smaA(del,3),ds=del.map((v,i)=>sm[i]===null?v:sm[i]),cvd=[];let sd=-1,c0=0;
  for(let i=0;i<n;i++){const d=sessDay(a[i].t);if(d!==sd){c0=0;sd=d}c0+=ds[i];cvd.push(c0)}
  const e20=ema(cvd,20),e50=ema(cvd,50),e200=ema(cvd,200),K=[],bp=[],vel=[];
  for(let i=0;i<n;i++){let br=0,sr=0;
    for(let j=0;j<20&&i-j>=0;j++){const k=i-j,d=ds[k],w=conf[k]*rv[k]*(1-j/20)*(e20[k]>e50[k]?1.1:.9);if(d>0)br+=d*w;else sr+=Math.abs(d)*w}
    bp.push(br+sr>0?br/(br+sr)*100:50);vel.push(i>=5?bp[i]-bp[i-5]:0);
    const sp=100-bp[i],cf=conf[i]*100,ts=(e20[i]>e50[i]?40:0)+(e50[i]>e200[i]?30:0)+(i&&e20[i]>e20[i-1]?20:0)+(cvd[i]>e20[i]?10:0),ac=i?vel[i]-vel[i-1]:0;
    let mx=-1e18,mn=1e18;for(let j=Math.max(0,i-19);j<=i;j++){mx=Math.max(mx,cvd[j]);mn=Math.min(mn,cvd[j])}
    const dw=i&&Math.abs(ds[i])<Math.abs(ds[i-1]),cw=i&&conf[i]<conf[i-1];
    let bx=0,sx=0;if(cvd[i]>=mx*.98)bx+=25;if(ds[i]>0&&dw)bx+=25;if(cw&&ds[i]>0)bx+=20;if(vel[i]<0)bx+=15;if(ac<0)bx+=15;bx=Math.min(bx,100);
    if(cvd[i]<=mn*1.02)sx+=25;if(ds[i]<0&&dw)sx+=25;if(cw&&ds[i]<0)sx+=20;if(vel[i]>0)sx+=15;if(ac>0)sx+=15;sx=Math.min(sx,100);
    const fb=cl(cf*.2+ts*.2+bp[i]*.2+(100-bx)*.15+Math.max(0,vel[i])*.1+Math.max(0,ac)*.05+rv[i]*50*.1,0,100),
      fs=cl(cf*.2+(100-ts)*.2+sp*.2+(100-sx)*.15+Math.max(0,-vel[i])*.1+Math.max(0,-ac)*.05+rv[i]*50*.1,0,100),
      bh=Math.min(bp[i]*.35+ts*.25+cf*.2+(100-bx)*.2,100),sh=Math.min(sp*.35+(100-ts)*.25+cf*.2+(100-sx)*.2,100);
    const sg=ts>=80&&cf>=80?'SB':ts>=60&&cf>=60?'B':ts<=20&&cf>=80?'SS':ts<=40&&cf>=60?'S':'W';
    K.push({cf,ts,sg,sd:sg==='SB'||sg==='B'?1:sg==='SS'||sg==='S'?-1:0,bp:bp[i],sp,bx,sx,fb,fs,bh,sh,A:atr[i],
      rt:ts>=90?'EXTREME BULL':ts>=75?'STRONG BULL':ts>=60?'BULL':ts>=40?'NEUTRAL':ts>=25?'BEAR':'STRONG BEAR'})}
  return K}
const SGT={SB:'STRONG BUY',B:'BUY',SS:'STRONG SELL',S:'SELL',W:'WAIT'};
/* Panel hodnot: zeleně vše, co patří ke koupi, červeně vše, co patří k prodeji (u společných hodnot podle směru signálu, nebo trendu, když je signál WAIT). */
function cvdDash(k){if(!k)return'';const dir=k.sd!==0?k.sd:(k.ts>=60?1:k.ts<=40?-1:0),G='63,184,165',Rd='232,104,90',N0='154,141,115',
  dc=dir>0?G:dir<0?Rd:N0,tx=dir>0?'var(--lg)':dir<0?'var(--sh)':'var(--tx)',al=v=>(.12+.33*Math.max(0,Math.min(100,v))/100).toFixed(2),r=Math.round;
  const c=[[k.rt,'Trend',dc,.3,tx],[r(k.ts),'Trend Score',dc,.3,tx],[r(k.cf),'Confidence',dc,.3,tx],[SGT[k.sg],'Signál',dc,.45,tx],
    [r(k.bp),'Buy Pressure',G,al(k.bp),'var(--lg)'],[r(k.sp),'Sell Pressure',Rd,al(k.sp),'var(--sh)'],[r(k.bx),'Buy Exhaust',G,al(k.bx),'var(--lg)'],[r(k.sx),'Sell Exhaust',Rd,al(k.sx),'var(--sh)'],
    [r(k.fb),'Flow Buy',G,al(k.fb),'var(--lg)'],[r(k.fs),'Flow Sell',Rd,al(k.fs),'var(--sh)'],[r(k.bh),'Buy Heat',G,al(k.bh),'var(--lg)'],[r(k.sh),'Sell Heat',Rd,al(k.sh),'var(--sh)']];
  return '<div class="st" style="margin-bottom:10px">'+c.map(x=>`<div style="background:rgba(${x[2]},${x[3]})"><b style="font-size:14px;color:${x[4]}">${x[0]}</b>${x[1]}</div>`).join('')+'</div>'}
/* Varianty: vstup po uzavření svíčky, kdy podmínka nově začne platit. Jen po trendu (BUY má trend score ≥ 60, SELL ≤ 40). SL = SLM × ATR, TP podle RR. */
const KV=[['CVD: signál BUY/SELL',(s,d)=>s.sd===d],['CVD: jen STRONG BUY/SELL',(s,d)=>s.sg===(d>0?'SB':'SS')],
  ['CVD: signál + flow, heat, exhaust',(s,d)=>s.sd===d&&(d>0?(s.fb>=60&&s.bh>=60&&s.bx<=40):(s.fs>=60&&s.sh>=60&&s.sx<=40))]];
function genCVD(a,k0){const K=cvdCalc(a),out=[];
  for(const [nm,fn] of KV)for(const d of [1,-1]){let last=-99;
    for(let i=Math.max(300,k0);i<a.length;i++){if(!(fn(K[i],d)&&!fn(K[i-1],d))||i-last<6)continue;last=i;
      const e=a[i].c,rk=SLM*K[i].A;if(!(rk>0))continue;out.push({ty:nm,i,L:d>0,e,sl:d>0?e-rk:e+rk,et:a[i].t+36e5,A:K[i].A})}}
  return out}
/* Kontrola bez indikátoru: vstup po trendu z cen (EMA 20 nad EMA 50 a close nad EMA 20), když podmínka nově začne platit. Stejná správa obchodu a SL. */
function genCtrl(a,k0){const c=a.map(q=>q.c),E20=ema(c,20),E50=ema(c,50),out=[];
  for(const d of [1,-1]){let last=-99;const f=i=>d>0?(E20[i]>E50[i]&&c[i]>E20[i]):(E20[i]<E50[i]&&c[i]<E20[i]);
    for(let i=Math.max(300,k0);i<a.length;i++){if(!(f(i)&&!f(i-1))||i-last<6)continue;last=i;const rk=SLM*avgRange(a.slice(i-14,i));if(!(rk>0))continue;
      out.push({ty:'Kontrola: prostý trend (EMA 20/50 na ceně)',i,L:d>0,e:c[i],sl:d>0?c[i]-rk:c[i]+rk,et:a[i].t+36e5,A:rk/SLM})}}
  return out}
function trades(a,k0){return genCVD(a,k0).concat(genCtrl(a,k0),genAsia(a,1,0,k0))}
/* Vstupy jen v Londýně a New Yorku (7 až 21 UTC). */
const inS=t=>{const h=new Date(t).getUTCHours();return h>=7&&h<21};
function ev(a,t,m){let j=t.i;
  if(t.lim){j=-1;for(let q=t.i+1;q<a.length&&q<=t.i+24;q++){const c=a[q];if(c.l<=t.e&&c.h>=t.e){j=q;break}}
    if(j<0||!inS(a[j].t))return null;const c=a[j];if(t.L?c.l<=t.sl:c.h>=t.sl)return{R:-1-SPR/Math.abs(t.e-t.sl),et:c.t}}
  else if(!inS(t.et))return null;
  const r=mgmt(a,j,t.L,t.e,t.sl,m);return{R:r.R,et:t.lim?a[j].t:t.et}}
const cl=v=>v===null?'<td>—</td>':`<td class="${v>=0?'pos':'neg'}">${v.toFixed(2)}</td>`;

let HB=null,HBt=0,tm;
async function today(){clearTimeout(tm);
  if(!key){$('sig').innerHTML='<div class="warn">Zadej dole svůj Twelve Data API klíč.</div>';return}
  try{const now=Date.now();if(!HB||now-HBt>3e5){HB=(await load(500)).filter(q=>q.h-q.l>=1);HBt=now}
    const a=HB.filter(q=>q.t+36e5<=now);if(a.length<320){$('sig').innerHTML='<div class="warn">Málo dat (trh je zavřený?).</div>';return}
    const p=HB[HB.length-1].c,A=avgRange(a),tr=trend(a.slice(-250)),T=trades(a,a.length-3).filter(t=>t.et>=now-3*36e5);
    $('px').textContent=f(p);
    $('meta').innerHTML=`<span>Trend H1 <b>${tr>0?'↑':'↓'}</b></span><span>ATR <b>${f(A)}</b></span><span>Aktualizace <b>${new Date().toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'})}</b></span>`;
    $('msg').innerHTML=a[a.length-1].h-a[a.length-1].l<1?'<div class="warn">Trh je zavřený, ceny jsou z posledního close.</div>':'';
    $('sig').innerHTML=cvdDash(cvdCalc(a).slice(-1)[0])+T.map(t=>{const r=Math.abs(t.e-t.sl),tp=t.L?t.e+RR*r:t.e-RR*r,act=t.lim&&Math.abs(p-t.e)<=.5*(t.A||A);
      return `<div class="t ${t.L?'LONG':'SHORT'}"><h2><span>${t.L?'LONG':'SHORT'}</span><span class="${act?'on':''}">${t.lim?(act?'limit v zóně':'čekající limit'):'vstup po zavření svíčky'}</span></h2><small>${t.ty} · riziko ${f(r)} b. · po +1R lze SL přesunout na vstup</small><div class="g"><div>Vstup<b>${f(t.e)}</b></div><div>SL<b>${f(t.sl)}</b></div><div>TP 1:${RR}<b>${f(tp)}</b></div><div>1R<b>${f(t.L?t.e+r:t.e-r)}</b></div></div></div>`}).join('')||'<div class="warn">Žádný aktuální signál. Počkej na další uzavřenou svíčku.</div>'
  }catch(e){$('sig').innerHTML='<div class="warn">Chyba: '+(e.message||'bez textu')+'</div>'}
  tm=setTimeout(today,3e5)}

async function bt(){
  if(!key){$('bt').textContent='Nejdřív zadej API klíč.';return}
  try{const M=await pgs([1,3,6][per],'1h',$('bt')),a=M.filter(q=>q.h-q.l>=1);$('bt').textContent='Počítám…';await new Promise(r=>setTimeout(r,60));
    const T=trades(a,0),mid=(a[0].t+a[a.length-1].t)/2,sel=$('mg').value;let all=[],rows='';
    [...new Set(T.map(t=>t.ty))].forEach(nm=>{const L=T.filter(t=>t.ty===nm),rk=L.map(t=>Math.abs(t.e-t.sl));
      rows+=`<tr><th colspan="6">${nm} · ${L.length} signálů · prům. riziko ${f(mean(rk))} b. · spread ≈ ${mean(rk.map(x=>SPR/x)).toFixed(2)} R</th></tr>`;
      MG.forEach(([m,lb])=>{const R=L.map(t=>ev(a,t,m)).filter(Boolean);if(m===sel)all=all.concat(R);
        rows+=`<tr><td>${lb}</td><td>${R.length}</td><td>${R.length?Math.round(100*R.filter(x=>x.R>0).length/R.length):0} %</td>${cl(mean(R.map(x=>x.R)))}${cl(mean(R.filter(x=>x.et<mid).map(x=>x.R)))}${cl(mean(R.filter(x=>x.et>=mid).map(x=>x.R)))}</tr>`})});
    all.sort((x,y)=>x.et-y.et);
    const R=all.map(x=>x.R),pts=[0];let eq=0,pk=0,dd=0;R.forEach(r=>{eq+=r;pts.push(eq);pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq)});
    const gw=R.filter(r=>r>0).reduce((x,y)=>x+y,0),gl=-R.filter(r=>r<0).reduce((x,y)=>x+y,0),e1=mean(all.filter(x=>x.et<mid).map(x=>x.R)),e2=mean(all.filter(x=>x.et>=mid).map(x=>x.R)),ex=mean(R);
    const c=$('eq'),x=c.getContext('2d');c.width=700;c.height=300;
    if(R.length){const mn=Math.min(...pts,0),mx=Math.max(...pts,0)+1,Y=v=>290-(v-mn)/(mx-mn)*280;x.strokeStyle='#33291a';x.beginPath();x.moveTo(0,Y(0));x.lineTo(700,Y(0));x.stroke();
      x.strokeStyle='#d9aa3c';x.lineWidth=3;x.beginPath();pts.forEach((v,i)=>{const X=i/(pts.length-1||1)*700;i?x.lineTo(X,Y(v)):x.moveTo(X,Y(v))});x.stroke();x.fillStyle='#9a8d73';x.font='20px system-ui';x.fillText('Všechny strategie dohromady, celkem '+eq.toFixed(1)+' R',8,24)}
    const good=R.length>=150&&e1>0&&e2>0;
    $('sm').innerHTML=R.length?`<div class="st"><div><b>${R.length}</b>obchodů</div><div><b>${ex.toFixed(2)}</b>R/obchod</div><div><b>${gl?(gw/gl).toFixed(2):'—'}</b>profit factor</div><div><b>${dd.toFixed(0)} R</b>max. propad</div></div><p class="f">1. polovina ${e1===null?'—':e1.toFixed(2)} R/obchod · 2. polovina ${e2===null?'—':e2.toFixed(2)}. ${good?'Kladné v obou polovinách a dost obchodů, kandidát na demo účet.':'Výhoda zatím není prokázaná (je potřeba aspoň 150 obchodů a kladný výsledek v obou polovinách).'}</p>`:'';
    const d=t=>new Date(t).toLocaleDateString('cs');
    $('bt').innerHTML=`<table><tr><th>Správa</th><th>N</th><th>Win</th><th>R/ob.</th><th>1. pol.</th><th>2. pol.</th></tr>${rows}</table><p>Období ${d(a[0].t)} až ${d(a[a.length-1].t)}, ${a.length} H1 svíček. RR 1:${RR} (u trailingu se cíl nepoužívá), spread ${SPR} b. započítán. Souhrn nahoře sčítá všechny strategie se správou „${$('mg').selectedOptions[0].text}“.</p>`
  }catch(e){$('bt').textContent='Chyba: '+e.message}}

$('go').onclick=()=>{key=$('key').value.trim();RR=+$('rr').value;SPR=+$('spr').value||0;SLM=+$('slm').value;per=+$('per').value;VM=+$('vm').value;
  S.s('key',key);S.s('rr',RR);S.s('spr',SPR);S.s('slm',SLM);S.s('per',per);S.s('vm',VM);HB=null;today()};
$('rf').onclick=()=>{HB=null;today()};$('btb').onclick=bt;
today();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
