<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110c">
<meta name="robots" content="noindex,nofollow">
<title>Gold H1 Setupy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#14110c;--card:#1f1a12;--line:#33291a;--tx:#f1e9d8;--mu:#9a8d73;--au:#d9aa3c;--lg:#3fb8a5;--sh:#e8685a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 40px;max-width:560px;margin:auto;font-variant-numeric:tabular-nums}
h1{font:600 15px system-ui;color:var(--mu);margin:0 0 2px}
.px{font:700 44px/1.1 Georgia,serif;color:var(--au);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;color:var(--mu);font-size:13px}
.row b{color:var(--tx);font-weight:600}
.warn{background:#3a2a10;border:1px solid var(--au);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
canvas{width:100%;height:190px;background:var(--card);border-radius:10px;display:block}
.t{background:var(--card);border-radius:12px;padding:12px 14px;margin:12px 0;border-left:5px solid var(--mu)}
.t.LONG{border-color:var(--lg)}.t.SHORT{border-color:var(--sh)}
.t h2{margin:0 0 4px;font-size:18px;display:flex;justify-content:space-between}
.LONG h2 span:first-child{color:var(--lg)}.SHORT h2 span:first-child{color:var(--sh)}
.t small{color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.g div{font-size:12px;color:var(--mu)}.g b{display:block;font-size:16px;color:var(--tx)}
.on{color:var(--au);font-weight:700}
h3{margin:22px 0 6px;font-size:16px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st div{background:var(--card);border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mu)}
.st b{display:block;font-size:20px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mu);font-weight:500}
.win{color:var(--lg)}.loss{color:var(--sh)}
button,input{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px 12px}
button{background:var(--au);color:#14110c;border:0;font-weight:700}
input{width:100%;margin:6px 0}
select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px;width:100%;margin:6px 0}
.pos{color:var(--lg)}.neg{color:var(--sh)}
.f{color:var(--mu);font-size:12px;margin-top:20px}
</style></head><body>
<h1>XAU/USD · H1</h1>
<p class="px" id="px">—</p>
<div class="row" id="meta"></div>
<div id="msg"></div>
<canvas id="cv"></canvas>
<div id="tk"></div>
<h3>Statistiky (tvoří se samy)</h3>
<div class="st" id="st"></div>
<h3>Poslední setupy</h3>
<table id="lg"></table>
<h3>Backtest na historii</h3>
<button id="btb">Spustit backtest (cca 8 měsíců)</button>
<div id="bt" class="f"></div>
<h3>Nastavení</h3>
<label class="f">Minimální síla zóny pro nové setupy</label>
<select id="min"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label class="f">Vynechat asijskou seanci (0:00–7:00 UTC)</label>
<select id="asia"><option value="1">Ano</option><option value="0">Ne</option></select>
<input id="key" type="password" placeholder="Twelve Data API klíč" autocomplete="off">
<button id="go">Uložit a obnovit</button>
<p class="f">Data se obnovují každých 5 minut, dokud je aplikace otevřená. Výsledky ukazují kvalitu pravidel, ne záruku zisku. Nejde o finanční poradenství.</p>
<script>
const $=i=>document.getElementById(i);
const S={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let key=S.g('key',''),log=S.g('log2',[]),minSc=S.g('min',3),asia=S.g('asia',1);$('key').value=key;$('min').value=minSc;$('asia').value=asia;
const f=n=>n.toFixed(1),N=x=>parseFloat(String(x).replace(',','.'));
async function load(n,iv,end){
  const r=await fetch('https://api.twelvedata.com/time_series?symbol=XAU/USD&interval='+iv+'&outputsize='+n+'&order=ASC'+(end?'&end_date='+encodeURIComponent(end):'')+'&apikey='+encodeURIComponent(key));
  const j=await r.json();if(j.status==='error'||!j.values)throw new Error(j.message||'Chyba dat');
  return j.values.map(v=>({d:v.datetime,t:Date.parse(v.datetime.replace(' ','T')+'Z'),o:N(v.open),h:N(v.high),l:N(v.low),c:N(v.close)}))}
function agg(M){const o=[];let k=-1;for(const q of M){const h=Math.floor(q.t/36e5);if(h!==k){o.push({t:h*36e5,o:q.o,h:q.h,l:q.l,c:q.c});k=h}else{const x=o[o.length-1];x.h=Math.max(x.h,q.h);x.l=Math.min(x.l,q.l);x.c=q.c}}return o}
function ema(a,n){const k=2/(n+1);let e=a[0];return a.map((x,i)=>(e=i?x*k+e*(1-k):x))}
function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l?100-100/(1+g/l):100}
function avgRange(a,n=14){const x=a.slice(-n);return x.reduce((s,q)=>s+q.h-q.l,0)/x.length}
function trend(w){const c=w.slice(-120).map(q=>q.c),a=ema(c,20),b=ema(c,50);return a[a.length-1]>b[b.length-1]?1:-1}

/* Zóny: swing úrovně sloučené do shluků + profil času na ceně (TPO, aproximace POC) */
function analyze(w){
  const A=avgRange(w),p=w[w.length-1].c,pv=[];
  for(let i=4;i<w.length-4;i++){let hi=1,lo=1;for(let j=i-4;j<=i+4;j++){if(w[j].h>w[i].h)hi=0;if(w[j].l<w[i].l)lo=0}if(hi)pv.push(w[i].h);if(lo)pv.push(w[i].l)}
  pv.sort((x,y)=>x-y);const cl=[];
  for(const q of pv){const c=cl[cl.length-1];if(c&&q-c.mx<=.5*A){c.mx=q;c.s+=q;c.n++}else cl.push({mx:q,s:q,n:1})}
  const mn=Math.min(...w.map(q=>q.l)),bw=Math.max(.5,A/6),b=[];
  w.forEach(q=>{for(let k=Math.floor((q.l-mn)/bw);k<=Math.floor((q.h-mn)/bw);k++)b[k]=(b[k]||0)+1});
  let pk=0,pi=0;b.forEach((x,i)=>{if(x>pk){pk=x;pi=i}});
  const z=cl.map(c=>{const lv=c.s/c.n,k=Math.floor((lv-mn)/bw),r=Math.round(A/bw);let m=0;for(let q=k-r;q<=k+r;q++)m=Math.max(m,b[q]||0);const ra=m/pk;
    return{lv,n:c.n,poc:ra>=.95,sc:c.n+(ra>=.95?2:ra>=.7?1:0)}});
  return{A,p,poc:mn+(pi+.5)*bw,z}}
function build(an,tr,min){const o=[],{A,p,z}=an;
  const up=z.filter(x=>x.lv>p+.7*A&&x.sc>=min).sort((x,y)=>x.lv-y.lv)[0],dn=z.filter(x=>x.lv<p-.7*A&&x.sc>=min).sort((x,y)=>y.lv-x.lv)[0];
  if(up){const e=up.lv-.3*A,sl=up.lv+.6*A,r=sl-e;o.push({dir:'SHORT',e,sl,tp:e-2*r,tp2:e-3*r,lv:up.lv,sc:up.sc,n:up.n,poc:up.poc,tr:tr<0})}
  if(dn){const e=dn.lv+.3*A,sl=dn.lv-.6*A,r=e-sl;o.push({dir:'LONG',e,sl,tp:e+2*r,tp2:e+3*r,lv:dn.lv,sc:dn.sc,n:dn.n,poc:dn.poc,tr:tr>0})}
  return o}
/* Simulace: vrací win / loss / exp, nebo null když ještě neskončilo. Při SL i TP v jedné svíčce se počítá SL. */
function sim(a,i,s,skip){let st=0,n=0;const L=s.dir==='LONG';
  for(let j=i+1;j<a.length;j++){const c=a[j];n++;
    if(!st){if(c.l<=s.e&&c.h>=s.e){st=1;s.et=c.t;if(skip&&new Date(c.t).getUTCHours()<7)return'skip'}else if(n>24)return'exp';else continue}
    if(L?c.l<=s.sl:c.h>=s.sl)return'loss';if(L?c.h>=s.tp:c.l<=s.tp)return'win';if(n>300)return'exp'}
  return null}

/* Potvrzení na 5m: dotek zóny, svíčka zavřená zpět od zóny a za EMA9 (5m). Vstup = close té svíčky, SL za extrémem doteku, TP 1:2. */
function track(M,E,k0,s,A,skip){const L=s.dir==='LONG',z=L?s.lv+.3*A:s.lv-.3*A,inv=L?s.lv-.6*A:s.lv+.6*A;
  let st=0,x=0,n=0,r;
  for(let k=k0;k<M.length;k++){const c=M[k];
    if(st<2){
      if(!st){if(L?c.l<=z:c.h>=z){st=1;x=L?c.l:c.h;n=0}else{if(k-k0>288)return{st:'exp'};continue}}
      else{x=L?Math.min(x,c.l):Math.max(x,c.h);n++}
      if(L?x<=inv:x>=inv)return{st:'exp'};
      if(n>12)return{st:'exp'};
      if(L?(c.c>E[k]&&c.c>z&&c.c>c.o):(c.c<E[k]&&c.c<z&&c.c<c.o)){
        const e=c.c,sl=L?x-.1*A:x+.1*A,rk=Math.abs(e-sl);
        if(rk<.25*A||rk>1.2*A)return{st:'exp'};
        if(skip&&new Date(c.t).getUTCHours()<7)return{st:'skip'};
        r={e,sl,tp:L?e+2*rk:e-2*rk,et:c.t};st=2}
      continue}
    if(L?c.l<=r.sl:c.h>=r.sl)return{...r,st:'loss'};
    if(L?c.h>=r.tp:c.l<=r.tp)return{...r,st:'win'};
    if(k-k0>600)return{st:'exp'}}
  return st===2?{...r,st:'entry'}:{st:st?'touch':'wait'}}

function chart(a,ls){const c=$('cv'),x=c.getContext('2d');c.width=700;c.height=380;
  const v=a.slice(-60),all=v.flatMap(q=>[q.h,q.l]).concat(ls.map(l=>l.y)),mn=Math.min(...all)-4,mx=Math.max(...all)+4,
  Y=p=>380-(p-mn)/(mx-mn)*380,w=700/v.length;
  v.forEach((q,i)=>{const X=i*w+w/2;x.strokeStyle=q.c>=q.o?'#3fb8a5':'#e8685a';x.lineWidth=1.5;x.beginPath();x.moveTo(X,Y(q.h));x.lineTo(X,Y(q.l));x.stroke();x.lineWidth=5;x.beginPath();x.moveTo(X,Y(q.o));x.lineTo(X,Y(q.c));x.stroke()});
  x.lineWidth=1.5;x.font='20px system-ui';
  ls.forEach(l=>{x.strokeStyle=x.fillStyle=l.c;x.setLineDash([8,6]);x.beginPath();x.moveTo(0,Y(l.y));x.lineTo(700,Y(l.y));x.stroke();x.fillText(l.n+' '+f(l.y),6,Y(l.y)-5)})}

let near=0;
function render(raw,M){
  const a=raw.filter(q=>q.h-q.l>=1),w=a.slice(-250),p=M[M.length-1].c,E=ema(M.map(q=>q.c),9);
  const tr=trend(w),an=analyze(w),A=an.A,R=rsi(w.map(q=>q.c)),tk=build(an,tr,minSc);
  const closed=raw[raw.length-1].h-raw[raw.length-1].l<1;
  $('px').textContent=f(p);
  $('meta').innerHTML=`<span>Trend <b>${tr>0?'rostoucí':'klesající'}</b></span><span>RSI <b>${R.toFixed(0)}</b></span><span>ATR <b>${f(A)}</b></span><span>POC <b>${f(an.poc)}</b></span><span>EMA9 5m <b>${f(E[E.length-1])}</b></span><span>Aktualizace <b>${new Date().toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'})}</b></span>`;
  $('msg').innerHTML=(closed?'<div class="warn">Trh je zavřený, ceny jsou z posledního close. Nové setupy dávají smysl po otevření.</div>':'')+(asia&&!closed&&new Date().getUTCHours()<7?'<div class="warn">Asijská seance (do 7:00 UTC). Vstupy vynechej a počkej na Londýn.</div>':'');
  tk.forEach(s=>{s.q=track(M,E,Math.max(0,M.length-96),s,A,asia)});
  near=!closed&&tk.some(s=>Math.abs(p-s.lv)<1.5*A)?1:0;
  tk.forEach(s=>{const q=s.q;if(!q.et)return;const id=s.dir+Math.round(s.lv)+'@'+q.et,it=log.find(x=>x.id===id),st=q.st==='entry'?'wait':q.st;
    if(!it)log.push({id,dir:s.dir,e:q.e,sl:q.sl,tp:q.tp,t:q.et,st});else if(it.st==='wait')it.st=st});
  log.forEach(it=>{if(it.st!=='wait')return;const arr=it.t>=M[0].t?M:raw,L=it.dir==='LONG';
    for(const c of arr){if(c.t<=it.t)continue;if(L?c.l<=it.sl:c.h>=it.sl){it.st='loss';break}if(L?c.h>=it.tp:c.l<=it.tp){it.st='win';break}}});
  log=log.slice(-300);S.s('log2',log);
  const T={wait:'čekej na dotek zóny',touch:'dotek zóny, čekej na potvrzení',entry:'POTVRZENO',win:'TP splněno',loss:'SL zasažen',exp:'zrušeno',skip:'Asie, vynecháno'};
  $('tk').innerHTML=tk.map(s=>{const q=s.q,L=s.dir==='LONG',z=L?s.lv+.3*A:s.lv-.3*A,inv=L?s.lv-.6*A:s.lv+.6*A;
    const gr=q.e?`<div>Vstup<b>${f(q.e)}</b></div><div>SL<b>${f(q.sl)}</b></div><div>TP 1:2<b>${f(q.tp)}</b></div><div>TP 1:3<b>${f(q.e+(q.tp-q.e)*1.5)}</b></div>`:`<div>Zóna<b>${f(z)}</b></div><div>EMA9 5m<b>${f(E[E.length-1])}</b></div><div>Neplatí<b>${f(inv)}</b></div><div>Cena<b>${f(p)}</b></div>`;
    return `<div class="t ${s.dir}"><h2><span>${s.dir}</span><span class="${q.st==='entry'?'on':''}">${T[q.st]}${q.st==='wait'?' '+f(z):''}</span></h2>
    <small>${s.tr?'Po trendu':'Proti trendu'} · síla zóny ${s.sc} (${s.n}× dotyk${s.poc?', u POC':''}) · úroveň ${f(s.lv)}</small><div class="g">${gr}</div></div>`}).join('')||'<div class="warn">Žádná dostatečně silná zóna v okolí ceny. Můžeš snížit minimální sílu v nastavení.</div>';
  const ls=[{y:an.poc,c:'#d9aa3c',n:'POC'}];
  tk.forEach(s=>{ls.push({y:s.lv,c:'#9a8d73',n:s.dir==='SHORT'?'odpor':'podpora'});if(s.q.e&&(s.q.st==='entry'))ls.push({y:s.q.e,c:'#f1e9d8',n:'vstup'},{y:s.q.sl,c:'#e8685a',n:'SL'},{y:s.q.tp,c:'#3fb8a5',n:'TP'})});
  chart(a,ls);stats()}

function stats(){
  const d=log.filter(x=>x.st==='win'||x.st==='loss'),w=d.filter(x=>x.st==='win').length,Rr=w*2-(d.length-w),op=log.filter(x=>x.st==='wait').length;
  $('st').innerHTML=`<div><b>${d.length}</b>uzavřeno</div><div><b>${d.length?Math.round(100*w/d.length):0} %</b>win rate</div><div><b>${Rr>0?'+':''}${Rr} R</b>celkem</div><div><b>${op}</b>otevřeno</div>`;
  const nm={wait:'čeká',win:'TP',loss:'SL',exp:'propadl',skip:'Asie'};
  $('lg').innerHTML='<tr><th>Čas</th><th>Směr</th><th>Vstup</th><th>Stav</th></tr>'+(log.slice(-8).reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleString('cs',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${x.dir}</td><td>${f(x.e)}</td><td class="${x.st}">${nm[x.st]}</td></tr>`).join('')||'<tr><td colspan="4">Zatím žádné. Setupy se ukládají při každém obnovení.</td></tr>')}

async function bt(){
  if(!key){$('bt').textContent='Nejdřív zadej API klíč.';return}
  try{
    let M=[],end=null;
    for(let p=0;p<4;p++){$('bt').textContent='Stahuju 5m historii '+(p+1)+'/4…';const pg=await load(5000,'5min',end);
      M=pg.filter(q=>!M.length||q.t<M[0].t).concat(M);end=pg[0].d;if(pg.length<5000)break;await new Promise(r=>setTimeout(r,800))}
    $('bt').textContent='Počítám…';await new Promise(r=>setTimeout(r,60));
    const H=agg(M).filter(q=>q.h-q.l>=1),E=ema(M.map(q=>q.c),9);
    const bs=t=>{let lo=0,hi=M.length;while(lo<hi){const m=lo+hi>>1;M[m].t<t?lo=m+1:hi=m}return lo};
    const RO=[],RN=[],last={};
    for(let i=249;i<H.length-2;i++){const w=H.slice(i-249,i+1),an=analyze(w),tr=trend(w);
      for(const s of build(an,tr,1)){const id=s.dir+Math.round(s.lv);if(id in last&&i-last[id]<24)continue;last[id]=i;
        const t1={...s},o=sim(H,i,t1);if(o==='win'||o==='loss')RO.push({...s,o,et:t1.et});
        const q=track(M,E,bs(H[i].t+36e5),s,an.A);if(q.st==='win'||q.st==='loss')RN.push({...s,o:q.st,et:q.et})}}
    const asiaN=x=>new Date(x.et).getUTCHours()>=7;
    const G=[['Všechny',x=>1],['Síla ≥ 3',x=>x.sc>=3],['Síla ≥ 4',x=>x.sc>=4],['Po trendu',x=>x.tr],['Proti trendu',x=>!x.tr],['Bez Asie',asiaN],['Jen Asie',x=>!asiaN(x)],['Bez Asie + po trendu',x=>x.tr&&asiaN(x)],['Bez Asie + trend + síla ≥ 4',x=>x.tr&&x.sc>=4&&asiaN(x)],['LONG',x=>x.dir==='LONG'],['SHORT',x=>x.dir==='SHORT']];
    const sm=g=>{const n=g.length,w=g.filter(x=>x.o==='win').length,t=w*2-(n-w);return{n,w:n?Math.round(100*w/n):0,e:n?t/n:0}};
    const cell=v=>`<td class="${v.e>=0?'pos':'neg'}">${v.n?v.e.toFixed(2):'—'}</td>`;
    const rows=G.map(([nm,fn])=>{const a=sm(RO.filter(fn)),b=sm(RN.filter(fn));return `<tr><td>${nm}</td><td>${a.n}</td>${cell(a)}<td>${b.n}</td><td>${b.w} %</td>${cell(b)}</tr>`}).join('');
    const d=t=>new Date(t).toLocaleDateString('cs');
    $('bt').innerHTML=`<table><tr><th>Skupina</th><th>Limit N</th><th>R/ob.</th><th>Potv. N</th><th>Win</th><th>R/ob.</th></tr>${rows}</table><p>Limit = původní vstup u zóny. Potv. = dotek zóny, odmítnutí a close za EMA9 na 5m. Období ${d(M[0].t)} až ${d(M[M.length-1].t)}, ${M.length} svíček 5m. TP 1:2, zisková hranice win rate 33 %. Bez spreadu a poplatků.</p>`
  }catch(e){$('bt').textContent='Chyba: '+e.message}}

let H1c=null,H1t=0,tm;
async function run(){
  clearTimeout(tm);
  if(!key){$('msg').innerHTML='<div class="warn">Zadej dole svůj Twelve Data API klíč.</div>';stats();return}
  try{if(!H1c||Date.now()-H1t>6e5){H1c=await load(400,'1h');H1t=Date.now()}render(H1c,await load(150,'5min'))}
  catch(e){$('msg').innerHTML='<div class="warn">Chyba ('+(e.name||'?')+'): '+(e.message||'bez textu')+'</div>'}
  tm=setTimeout(run,near?6e4:3e5)}
$('go').onclick=()=>{key=$('key').value.trim();minSc=+$('min').value;asia=+$('asia').value;S.s('key',key);S.s('min',minSc);S.s('asia',asia);H1c=null;run()};
$('btb').onclick=bt;
run();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
